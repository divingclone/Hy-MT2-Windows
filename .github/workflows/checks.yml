name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python-and-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical test dependency
        run: python -m pip install (Get-Content requirements-dev.txt | Where-Object { $_ -match '^numpy==' })
      - name: Offline configuration and download tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Reproduce the patched source
        run: python scripts/prepare_source.py --destination .local/source-check
